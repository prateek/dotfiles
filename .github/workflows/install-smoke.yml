name: install-smoke

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
        with:
          install_args: shellcheck
      - name: Shellcheck
        run: |
          # Discover scripts by shebang instead of a hand-kept list; zsh and
          # non-shell files self-exclude. Pathspecs a branch lacks are fine:
          # git ls-files just returns nothing for them.
          mapfile -t scripts < <(
            git ls-files scripts home/dot_agents/bin \
              home/dot_local/bin/executable_crit-open |
              while IFS= read -r file; do
                head -n 1 "$file" | grep -Eq '^#!/(usr/)?bin/(env[[:space:]]+)?(ba)?sh([[:space:]]|$)' && printf '%s\n' "$file"
              done
          )
          [ "${#scripts[@]}" -gt 0 ] || { echo "shellcheck discovery matched no scripts" >&2; exit 1; }
          printf '%s\n' "${scripts[@]}"
          shellcheck -x "${scripts[@]}"

  macos-dry-run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install test prerequisites
        run: brew install chezmoi bash mise ripgrep jq

      - name: Install pinned test tools
        run: |
          mise trust
          mise install just
          mise exec -- just test-tools

      - name: Docs lifecycle
        if: github.event_name == 'pull_request'
        run: echo "DOCS_LIFECYCLE_BASE=origin/master" >> "$GITHUB_ENV"

      - name: Docs lifecycle
        if: github.event_name == 'push'
        run: |
          base="${{ github.event.before }}"
          if git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            echo "DOCS_LIFECYCLE_BASE=$base" >> "$GITHUB_ENV"
          else
            echo "DOCS_LIFECYCLE_BASE=none" >> "$GITHUB_ENV"
          fi

      - name: Static and behavior suites
        run: mise exec -- just test-ci

      - name: Bootstrap app list regression
        run: |
          if scripts/packages/render-brewfile --machine-type personal | grep -En '^(cask "airflow"|cask "omnigraffle"|mas ")'; then
            exit 1
          fi
          if scripts/packages/render-brewfile --machine-type personal --include-mas | grep -En '^mas "MeetInOne"'; then
            exit 1
          fi
          # Work machines must not get the personal apps.
          if scripts/packages/render-brewfile --machine-type work | grep -En '^cask "(tailscale-app|arq|voiceink)"'; then
            echo "work machine type leaked a personal app cask" >&2
            exit 1
          fi

      - name: Brewfile parse
        run: |
          scripts/packages/render-brewfile --machine-type ci --output "${RUNNER_TEMP}/Brewfile.ci"
          scripts/packages/render-brewfile --machine-type personal --output "${RUNNER_TEMP}/Brewfile"
          scripts/packages/render-brewfile --machine-type personal --include-mas --output "${RUNNER_TEMP}/Brewfile.mas"
          scripts/packages/render-brewfile --machine-type work --output "${RUNNER_TEMP}/Brewfile.work"
          brew bundle list --all --file "${RUNNER_TEMP}/Brewfile.ci" >/dev/null
          brew bundle list --all --file "${RUNNER_TEMP}/Brewfile" >/dev/null
          brew bundle list --all --file "${RUNNER_TEMP}/Brewfile.mas" >/dev/null
          brew bundle list --all --file "${RUNNER_TEMP}/Brewfile.work" >/dev/null

      - name: Brew bundle (ci formulae only)
        run: |
          set -euo pipefail
          ci_brewfile="${RUNNER_TEMP}/Brewfile.ci"
          scripts/packages/render-brewfile --machine-type ci --output "$ci_brewfile"
          HOMEBREW_BUNDLE_CASK_SKIP="$(awk -F'"' '/^cask "/ { print $2 }' "$ci_brewfile" | xargs)"
          export HOMEBREW_BUNDLE_CASK_SKIP
          brew bundle install --no-upgrade --file "$ci_brewfile"
