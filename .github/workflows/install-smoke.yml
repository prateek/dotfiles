name: install-smoke

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck
        run: |
          # Discover scripts by shebang instead of a hand-kept list; zsh and
          # non-shell files self-exclude. Pathspecs a branch lacks are fine:
          # git ls-files just returns nothing for them.
          mapfile -t scripts < <(
            git ls-files scripts home/dot_agents/bin |
              while IFS= read -r file; do
                head -n 1 "$file" | grep -Eq '^#!/(usr/)?bin/(env[[:space:]]+)?(ba)?sh([[:space:]]|$)' && printf '%s\n' "$file"
              done
          )
          [ "${#scripts[@]}" -gt 0 ] || { echo "shellcheck discovery matched no scripts" >&2; exit 1; }
          printf '%s\n' "${scripts[@]}"
          shellcheck -x "${scripts[@]}"

  macos-dry-run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Zsh syntax check
        run: |
          zsh -n scripts/trace/run-zsh

      - name: Python syntax check
        run: python3 -m py_compile scripts/trace/xtrace-to-perfetto scripts/trace/merge-perfetto scripts/trace/open-perfetto

      - name: Docs lifecycle
        if: github.event_name == 'pull_request'
        run: DOCS_LIFECYCLE_BASE=origin/master make test-docs-lifecycle

      - name: Docs lifecycle
        if: github.event_name == 'push'
        run: |
          base="${{ github.event.before }}"
          if git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            DOCS_LIFECYCLE_BASE="$base" make test-docs-lifecycle
          else
            DOCS_LIFECYCLE_BASE=none make test-docs-lifecycle
          fi

      - name: Tart helper contract
        run: |
          make test-tart-install-helper
          make test-render-brewfile
          make test-package-gated-configs
          make test-machines-features
          make test-elevation-render
          make test-brew-bundle-script
          make test-fork-reconcile
          make test-fork-lifecycle-entry
          make test-xcode-install-script
          make test-chezmoi-config
          make test-chezmoi-script-status
          make test-chezmoi-drift-banner
          make test-finder-copy-path
          make test-codex-config
          make test-agentsview-config
          make test-reconcile-wiki-clone
          make test-claude-settings
          make test-pi-settings
          make test-claude-statusline
          make test-orca-settings
          make test-crit-config
          make test-acpx-model-drift
          make test-acpx-poll-stream
          make test-agent-skill-packages
          make test-gemini-meeting-sync
          make test-brew-install-wrapper
          make test-gh-extensions-script
          make test-selected-app-plists
          make test-zed-settings
          make test-zsh-prompt-host
          make test-moom-plist
          make test-tartelet-settings
          make test-tartelet-softnet-wrapper
          make test-plist-hooks
          make test-trace-perfetto
          make test-vm-install-log-scan
          make test-vm-postflight-macos

      - name: Bootstrap app list regression
        run: |
          if scripts/packages/render-brewfile --machine-type personal | grep -En '^(cask "airflow"|cask "omnigraffle"|mas ")'; then
            exit 1
          fi
          if scripts/packages/render-brewfile --machine-type personal --include-mas | grep -En '^mas "MeetInOne"'; then
            exit 1
          fi
          # Work machines must not get the personal apps.
          if scripts/packages/render-brewfile --machine-type work | grep -En '^cask "(tailscale-app|arq|voiceink)"'; then
            echo "work machine type leaked a personal app cask" >&2
            exit 1
          fi

      - name: Bootstrap smoke — chezmoi init + apply --dry-run, key machine types
        run: |
          set -euo pipefail
          for machine_type in ci personal work; do
            ./scripts/chezmoi/test-apply-dry-run.sh "$machine_type" "${{ github.workspace }}"
          done

      - name: Brewfile parse
        run: |
          scripts/packages/render-brewfile --machine-type ci --output "${RUNNER_TEMP}/Brewfile.ci"
          scripts/packages/render-brewfile --machine-type personal --output "${RUNNER_TEMP}/Brewfile"
          scripts/packages/render-brewfile --machine-type personal --include-mas --output "${RUNNER_TEMP}/Brewfile.mas"
          scripts/packages/render-brewfile --machine-type work --output "${RUNNER_TEMP}/Brewfile.work"
          brew bundle list --all --file "${RUNNER_TEMP}/Brewfile.ci" >/dev/null
          brew bundle list --all --file "${RUNNER_TEMP}/Brewfile" >/dev/null
          brew bundle list --all --file "${RUNNER_TEMP}/Brewfile.mas" >/dev/null
          brew bundle list --all --file "${RUNNER_TEMP}/Brewfile.work" >/dev/null

      - name: Brew bundle (ci formulae only)
        run: |
          set -euo pipefail
          ci_brewfile="${RUNNER_TEMP}/Brewfile.ci"
          scripts/packages/render-brewfile --machine-type ci --output "$ci_brewfile"
          HOMEBREW_BUNDLE_CASK_SKIP="$(awk -F'"' '/^cask "/ { print $2 }' "$ci_brewfile" | xargs)"
          export HOMEBREW_BUNDLE_CASK_SKIP
          brew bundle install --no-upgrade --file "$ci_brewfile"
