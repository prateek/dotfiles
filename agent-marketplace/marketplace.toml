# The published catalog. Each [plugins.<name>] table is one plugin, in catalog
# order: its version, its native manifest (display_name for the shared template,
# or a verbatim [plugins.<name>.manifest]), and its selections from vendor/.
# The build generates every plugin.json and APM's catalog manifest from this file.
name = "prateek-local"
version = "1.2.0"
description = "Reviewed local and curated skills"
license = "UNLICENSED"
category = "Productivity"
outputs = ["claude", "codex"]

[owner]
name = "Prateek"

