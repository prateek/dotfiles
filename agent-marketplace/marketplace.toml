[plugins.pstack]
version = "0.15.7"
mirror_invocation_controls = true

[plugins.pstack.manifest]
description = "pstack engineering workflow skills from Cursor's plugin marketplace."
homepage = "https://github.com/cursor/plugins/tree/main/pstack"
repository = "https://github.com/cursor/plugins"
license = "MIT"
keywords = ["pstack", "poteto-mode", "workflow", "principles", "subagents"]
skills = "./skills/"
agents = "./agents/"

[plugins.pstack.manifest.author]
name = "Lauren Tan"

[plugins.pstack.manifest.interface]
displayName = "pstack"
shortDescription = "Rigorous engineering workflow skills"
longDescription = "Cursor's pstack workflow and engineering-principle skills, packaged experimentally for Claude and Codex."
developerName = "Lauren Tan"
category = "Coding"
capabilities = ["Interactive", "Read", "Write"]
websiteURL = "https://github.com/cursor/plugins/tree/main/pstack"
defaultPrompt = ["Use poteto-mode for this task."]

[[plugins.pstack.payloads]]
dependency = "cursor/plugins/pstack"
path = "skills"
target = "skills"

[[plugins.pstack.payloads]]
dependency = "cursor/plugins/pstack"
path = "LICENSE"
target = "licenses/cursor/plugins/pstack/LICENSE"

[plugins.review]
version = "3.0.2"
display_name = "Review"
