# exe.dev lobby and VMs. VM connections pass through the lobby, so they present
# its host key, pinned in known_hosts.d/exe-dev (https://exe.dev/docs/faq/host-key).
#
# exe.dev identifies the account from the first key offered, so offer one
# dedicated key per machine:
#   ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519_exe -C "$USER@$(hostname -s)"
# then register ~/.ssh/id_ed25519_exe.pub at https://exe.dev/user/security.
Host exe.dev *.exe.xyz
  IdentitiesOnly yes
  IdentityFile ~/.ssh/id_ed25519_exe
  UserKnownHostsFile ~/.ssh/known_hosts.d/exe-dev
