# Language runtimes and their ecosystem package managers.

[tools]
# Node: track latest.
node = "latest"

# Go / Ruby: track latest.
go = "latest"
ruby = "latest"

# Rust: track latest, on every machine type.
rust = "latest"

# Yarn: track latest, tied to the Node ecosystem.
"npm:yarn" = "latest"

# pnpm: track latest, tied to the Node ecosystem.
"npm:pnpm" = "latest"

[settings.ruby]
# Use mise's signed precompiled Ruby artifacts when available.
compile = false
# Fresh bootstrap often runs before GitHub auth exists; unauthenticated
# attestation checks can exhaust the public API rate limit.
github_attestations = false
