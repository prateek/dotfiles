[[comboMode.bindings]]
iconPath = "wrench.and.screwdriver"
key = "z"
label = "misc"

    [comboMode.bindings.destination]
    type = "group"

        [[comboMode.bindings.destination.bindings]]
        iconPath = "display"
        key = "d"
        label = "G95NC sharp"

            [comboMode.bindings.destination.bindings.destination]
            type = "command"

                [comboMode.bindings.destination.bindings.destination.command]
                actionIdentifier = "tuna.common-actions/run-text-as-shell-command"
                behavior = "run"
                presentation = "automatic"
                subjectIdentifiers = ["text:\"$HOME/bin/g95nc\" set"]
                type = "savedCommand"

        [[comboMode.bindings.destination.bindings]]
        iconPath = "macmini"
        key = "m"
        label = "m4mini VNC"

            [comboMode.bindings.destination.bindings.destination]
            type = "url"
            url = "vnc://m4mini._rfb._tcp.local?quality=high&numVirtualDisplays=1"

        [[comboMode.bindings.destination.bindings]]
        iconPath = "key.fill"
        key = "z"
        label = "DAYJOB password"

            [comboMode.bindings.destination.bindings.destination]
            type = "command"

                [comboMode.bindings.destination.bindings.destination.command]
                actionIdentifier = "tuna.common-actions/run-text-as-shell-command"
                behavior = "run"
                presentation = "automatic"
                subjectIdentifiers = ["text:PATH=\"/opt/homebrew/bin:/usr/local/bin:$PATH\"; pw=$(op read \"op://sit2vqyvky7qzyumcj7j3mlf24/iwkie33ipaj5jydxy4qx3ngoqe/password\") || exit 1; old=$(pbpaste 2>/dev/null); printf %s \"$pw\" | pbcopy; sleep 0.15; osascript -e 'tell application \"System Events\" to keystroke \"v\" using command down'; sleep 0.4; printf %s \"$old\" | pbcopy"]
                type = "savedCommand"

        [[comboMode.bindings.destination.bindings]]
        iconPath = "lock.shield"
        key = "t"
        label = "Temp admin"

            [comboMode.bindings.destination.bindings.destination]
            type = "command"

                [comboMode.bindings.destination.bindings.destination.command]
                actionIdentifier = "tuna.common-actions/run-text-as-shell-command"
                behavior = "run"
                presentation = "automatic"
                subjectIdentifiers = ["text:\"$HOME/.config/raycast/scripts/temp-admin.sh\""]
                type = "savedCommand"

        [[comboMode.bindings.destination.bindings]]
        iconPath = "mic.fill"
        key = "r"
        label = "GhostPepper record"

            [comboMode.bindings.destination.bindings.destination]
            type = "url"
            url = "ghostpepper://start-meeting?x-error=ghostpepper%3A%2F%2Fstop-meeting"

        [[comboMode.bindings.destination.bindings]]
        iconPath = "doc.on.clipboard"
        key = "g"
        label = "Copy last recording"

            [comboMode.bindings.destination.bindings.destination]
            type = "url"
            url = "ghostpepper://copy-last-recording"

[hotkeys]
custom = []

    [hotkeys.app.activate]
    carbonKeyCode = 49
    carbonModifiers = 256

    [hotkeys.app.comboMode]
    carbonKeyCode = 79
    carbonModifiers = 0

[settings]
activationDoublePressTrigger = "leftOption"
comboModeCheatsheetDelayMS = 1000
comboModeCheatsheetShowDetails = false
comboModeThemeStyle = "cheatsheet"
fuzzyModeTriggerType = "doublePress"
screenPreference = "activeWindow"
shelfAutoCloseWhenTasksComplete = true
