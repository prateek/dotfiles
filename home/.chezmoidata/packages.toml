# Applies to: personal, work. Entries are written only by fork-lifecycle
# automation. Each entry installs a tap build in place of the official package
# named by `replaces`; the reconciler performs the swap before brew bundle, and
# brewfile.tmpl subtracts the replaced official while the entry exists.
[packages.groups.forks]
description = "Active downstream-fork builds installed from the prateek/forks tap"
entries = [
  { name = "prateek/forks/ghostpepper-fork", kind = "cask", replaces = "ghostpepper" },
]

# === Retired packages ===

# Applies to: every machine type with package installs. brew bundle only
# installs, so a package whose Brewfile entry was removed lingers on machines
# that installed it earlier. run_onchange_after_08-retired-packages uninstalls
# these wherever still present, and brewfile.tmpl fails the render if a name
# here is still declared in a selected group. Drop an entry once the fleet no
# longer carries the package.
[packages.retired]
brews = [
  { name = "gogcli" },  # gog is installed via mise (github:openclaw/gogcli)
]
casks = [
  { name = "codex" },  # the CLI installs standalone (run_after_07-codex-standalone.sh)
  { name = "periphery" },
  { name = "nikitabobko/tap/aerospace" },  # replaced by prateek/tap/winmux; the two must not run together
]
