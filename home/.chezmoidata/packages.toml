# Applies to: devbox.
# Only the formulae the last 60 days of agent sessions actually ran (see
# docs/plans/linux-devbox-plan.md). Casks and macOS-only tools stay off. Add a
# tool here when a session needs it, not in advance.
[packages.groups.devbox]
description = "Minimal CLI set for the Linux devbox, drawn from measured agent usage"
taps = [
  { name = "hashicorp/tap" },
  { name = "oven-sh/bun" },
  { name = "sourcegraph/src-cli" },
  { name = "raine/aven" },
]
brews = [
  # Source control and repository workflow.
  { name = "git" },
  { name = "gh" },
  { name = "git-spice" },
  { name = "git-delta" },
  { name = "gitleaks" },
  { name = "crit" },
  { name = "sourcegraph/src-cli/src-cli" },

  # Shell, search, and text tools.
  { name = "ripgrep" },
  { name = "fd" },
  { name = "fzf" },
  { name = "jq" },
  { name = "python-yq" },
  { name = "zoxide" },
  { name = "direnv" },
  { name = "tmux" },
  { name = "neovim" },
  { name = "vim" },
  # No zsh or bash: the image ships both, and a linuxbrew shell found by name
  # reads its rc files from the brew prefix, skipping the image's /etc/zsh setup.
  { name = "coreutils" },
  { name = "moreutils" },
  { name = "binutils" },
  { name = "netcat" },
  { name = "rsync" },
  { name = "wget" },
  { name = "zip" },
  { name = "hyperfine" },

  # Toolchains and task runners.
  { name = "mise" },
  { name = "uv" },
  { name = "oven-sh/bun/bun" },
  { name = "just" },
  { name = "shellcheck" },
  { name = "actionlint" },
  { name = "buildifier" },

  # Infrastructure and cloud.
  { name = "chezmoi" },
  { name = "docker" },
  { name = "kubernetes-cli" },
  { name = "hashicorp/tap/terraform" },
  { name = "ldcli" },
  { name = "googleworkspace-cli" },

  # Agents, documents, and media.
  { name = "raine/aven/aven" },
  { name = "herdr" },
  { name = "llm" },
  { name = "pandoc" },
  { name = "imagemagick" },
]

