# Reusable package groups. Each machine type selects a set of these groups via
# home/.chezmoidata/machines.toml (resolved by features.tmpl); the brewfile and
# the package-cask-enabled gate union each group's sections, deduped by name.
# See docs/adr/0010-machine-type-package-selection.md.

# === Reusable groups ===

# Applies to: ci, personal, homelab, work.
[packages.groups.core]
description = "Headless-safe baseline for every managed machine, including ci"
brews = [
  { name = "git" },
  { name = "gh" },
  { name = "gitleaks" },
  { name = "direnv" },
  { name = "mise" },
  { name = "usage" },  # mise generates its shell completions with it
  { name = "fd" },
  { name = "fzf" },
  { name = "ripgrep" },
  { name = "zoxide" },
  { name = "neovim" },
  { name = "tmux" },
  { name = "just" },
  { name = "shellcheck" },
  { name = "uv" },
]
casks = [
  { name = "1password-cli" },
]
gh_extensions = [
  { name = "enthus-appdev/gh-attach" },
]

# Applies to: personal, work.
[packages.groups.mac-desktop]
description = "Shared GUI apps and Mac control tools for daily-driver laptops"
taps = [
  { name = "yqrashawn/goku" },
  { name = "prateek/tap" },
]
brews = [
  # Keyboard and display control.
  { name = "yqrashawn/goku/goku" },
  { name = "brightness" },
  { name = "ddcctl" },

  # Desktop app install support and editor integration.
  { name = "mas" },
  { name = "herdr" },
]
casks = [
  # Accounts, browsers, terminals, and editors.
  { name = "1password", appdir = "/Applications" },
  { name = "google-chrome" },
  { name = "google-drive" },
  { name = "ghostty" },
  { name = "visual-studio-code" },
  { name = "zed" },
  { name = "cursor" },

  # Fonts.
  { name = "font-inter" },
  { name = "font-hack-nerd-font" },
  { name = "font-jetbrains-mono" },
  { name = "font-jetbrains-mono-nerd-font" },
  { name = "font-meslo-for-powerline" },

  # Input, window, launcher, and browser-routing tools.
  { name = "bettertouchtool" },
  { name = "karabiner-elements" },
  { name = "prateek/tap/winmux" },
  { name = "bentobox" },
  { name = "tuna" },
  { name = "moom", appdir = "/Applications" },
  { name = "raycast" },
  { name = "alfred" },
  { name = "yojam" },

  # Display, menu bar, diagnostics, and local virtualization.
  { name = "betterdisplay" },
  { name = "caffeine", appdir = "/Applications" },
  { name = "thaw" },
  { name = "whatcable" },
  { name = "key-codes", appdir = "/Applications" },
  { name = "orbstack" },
  { name = "radix" },

  # Notes, media, and subscription apps shared across daily-driver laptops.
  { name = "obsidian" },
  { name = "spotify", appdir = "/Applications" },
  { name = "setapp" },
]
# Apps installed from the Setapp subscription rather than Homebrew. Names must
# match the Setapp catalogue exactly (case- and version-sensitive: "Bartender 5",
# not "bartender"); run_after_22-setapp-apps resolves them against Setapp's store
# API. Declaring these requires the `setapp` cask in the same selection — see
# home/.chezmoitemplates/setapp-applist.tmpl and ADR 0024.
setapp_apps = [
  { name = "CleanShot X" },
  { name = "iStat Menus" },
  { name = "Maestri" },
  { name = "Soulver" },
  { name = "Yoink" },
]
mas = [
  { name = "Okta Verify", id = 490179405 },
]

# Applies to: personal, work, homelab.
[packages.groups.ai-agent-apps]
description = "AI coding agent CLIs, desktop apps, and the Orca orchestrator"
taps = [
  { name = "stablyai/orca" },
]
casks = [
  { name = "claude" },
  { name = "agentsview" },
