# Obfuscated 1Password refs. Format: op://<vault-id>/<item-id>/<field-id>
# (use IDs not names; names leak metadata). Per-machine local config can
# override these with human-readable refs in ~/.config/chezmoi/chezmoi.toml
# under [data.secrets.refs] for convenience.
#
# License-backed refs: each name corresponds to a private chezmoi template
# at the matching path in home/.chezmoidata/licenses.toml > paths.
# Empty value here means "not configured" — .chezmoiignore skips that
# license's path, as it skips every license until secrets_enabled=true is
# set on this machine.
[secrets.refs]
bettertouchtool_license = "op://eullhsfuyo6uyv25vjhpxi3riy/dwwk5ykvpgxv5nvflswoi4ror4/n6sx6pfcp5dmwiz5fdpm7mpyly"
moom_license = "op://eullhsfuyo6uyv25vjhpxi3riy/5ov7cczpxupl3n66dplgkpdpqm/drjlhw4darrrgp6yhn377aywte"
moom_upgrade_license = "op://eullhsfuyo6uyv25vjhpxi3riy/3citibmeffrqdliqlvw4vvb4ny/6zcbznmjguy6lvpznkwuhu5ewa"
alfred_license = ""

# Read with the operator's own `op` session (1Password app unlock), never the
# service account: this is the service account's token, and it lives in the
# Private vault, which service accounts cannot read. The apply preflight uses it
# to fill the login keychain on a machine that lacks the token.
[secrets.bootstrap]
op_service_account_token = "op://sit2vqyvky7qzyumcj7j3mlf24/r2rps74devyaosclqz53law3py/credential"
