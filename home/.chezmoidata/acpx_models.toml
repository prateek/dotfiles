[acpx_models]
efforts = ["off", "minimal", "low", "medium", "high", "xhigh", "max", "ultra"]
ttl_seconds = 86400
stale_seconds = 604800

[acpx_models.families.gpt]
pattern = '^gpt-[A-Za-z0-9][A-Za-z0-9.\[\]@_-]*$'

[acpx_models.families.opus]
pattern = '^claude-opus-[A-Za-z0-9][A-Za-z0-9.\[\]@_-]*$'

[acpx_models.families.fable]
pattern = '^claude-fable-[A-Za-z0-9][A-Za-z0-9.\[\]@_-]*$'

[acpx_models.families.gemini]
pattern = '^gemini-[A-Za-z0-9][A-Za-z0-9.\[\]@_-]*$'

[acpx_models.profiles]
agpt = { family = "gpt", selection = "current", steps = 0 }
agptx = { family = "gpt", selection = "current", steps = 1 }
