[acpx_models]
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
[acpx_models.families.gpt]
pattern = '^gpt-(?P<generation>\d+(?:\.\d+)*)(?:-(?P<tier>astra|sol|terra|luna|mini|nano))?(?:-\d{4}-\d{2}-\d{2})?$'
tiers = ["nano", "mini", "luna", "terra", "", "sol", "astra"]

[acpx_models.families.opus]
pattern = '^claude-opus-(?P<generation>\d+(?:[.-]\d{1,2})*)(?:-\d{8})?(?:@\d{8})?$'
tiers = [""]

[acpx_models.families.fable]
pattern = '^claude-fable-(?P<generation>\d+(?:[.-]\d{1,2})*)(?:-\d{8})?(?:@\d{8})?$'
tiers = [""]

[acpx_models.families.gemini]
pattern = '^gemini-(?P<generation>\d+(?:\.\d+)*)(?:-(?P<tier>flash-lite|flash|pro))?(?:-preview(?:-\d{2}-\d{2})?)?$'
tiers = ["flash-lite", "flash", "", "pro"]

# Profiles pin model intent; catalogs supply the provider's exact advertised ID.
[acpx_models.profiles]
agpt = { family = "gpt", model = "gpt-6.1-sol", effort = "medium" }
agptx = { family = "gpt", model = "gpt-6-astra", effort = "medium" }
