# Machine behavior, composed in layers by home/.chezmoitemplates/features.tmpl.
#
# The resolver merges the applicable layers, low precedence to high:
#   defaults < os.<os> < type.<machine_type> < host.<hostname>
#       < host-local [data].machines_local
# Later layers win. Scalars are last-writer-wins; a list (e.g. groups) is
# replaced wholesale by the highest layer that sets it (not concatenated).
# Keep feature values flat — scalars and lists, no nested tables — so the merge
# stays a simple last-writer-wins. See docs/adr/0012-config-gating-convention.md.
#
# [data] holds identity only (machine_type, paths, jamf_policy_id); all behavior
# lives here and resolves at apply time, so a change lands on the next
# `chezmoi apply` with no re-init. A new role is a [machines.type.*] layer; a
# richer attribute (OS, host, flavor) is a [machines.os.*] / [machines.host.*]
# layer — no new enum, no per-file `eq .machine_type` ladders.

[machines.defaults]
groups = ["core"]
run_install_scripts = true
apply_macos_defaults = true
# Secret-backed templates need the 1Password service account token in the
# login keychain; the apply preflight fails fast when it is missing.
secrets_enabled = false
private_overlay = false
elevation = "none"
granola_mcp = false
touchid_sudo = false
# Pin macOS HostName to <LocalHostName>.local when unset. Unset, the kernel hostname
# comes from DHCP (often just "Mac"), so the host.<hostname> layer never matches.
pin_hostname = false
# Agent CLIs selected for installation/plugin activation. crit's agent_cmd is
# set only when claude is listed. Empty by default so a machine opts in explicitly.
agent_clis = []
# ACP eligibility and preference are independent of installed/plugin clients.
# Lists replace wholesale in host/local overrides. acpx_order_<family> can
# reorder a subset for one family without admitting an undeclared route.
acpx_routes = []
acpx_local_providers = ["local", "ollama", "lmstudio"]
# Cross-machine agent-session archive (prateek/wiki-agent-sessions): hourly raw
# sync via a launchd agent, agentsview session_sources wiring, obsidian-wiki
# vault config. Hosts with this on MUST also set wiki_host_alias in their
# [machines.host.*] layer — the sync fails closed without it (no hostname
# fallback; two machines named "macbook-pro" must not share an archive dir).
agent_session_wiki = false
# Exactly one host runs the daily wiki ingest automation (single writer for
# wiki/); move it by moving this flag.
agent_session_wiki_ingest = false
# Archive clone shape. A sparse host keeps a blobless partial clone with only
# its own sessions/<alias>/ (plus health/ and the agent config dirs) checked
# out, so nothing from other machines reaches that disk, neither transcripts
# nor the distilled wiki/; it still pushes its own sessions in full. The
# ingest host reads every host and must stay full: the bootstrap script
# refuses a host that resolves both flags.
# See docs/adr/0018-sparse-work-archive-clones.md.
agent_session_wiki_sparse = false
# The machine sits behind a TLS-inspecting proxy that re-signs every
# connection with a corporate CA. macOS puts that CA in the System keychain,
# which Safari and Chromium read, but Node ships its own root store and ignores
# the keychain — so Node clients need NODE_EXTRA_CA_CERTS pointing at a bundle
# exported from it. See docs/runbooks/corp-tls-inspection.md.
tls_inspection = false
direnv_trust_monorepo = false

# Minimal/fast tier for CI dry-run, Tart smoke, and shell audits. Keeps the
# defaults' run_install_scripts/apply_macos_defaults = true so the Tart smoke
# lane (a real, minimal install) still runs the install scripts; non-installing
# contexts (the chezmoi-script-status test) opt out via [data].machines_local,
# and dry-runs never execute scripts regardless.
[machines.type.ci]
groups = ["core"]

# Personal daily-driver Mac.
[machines.type.personal]
groups = ["core", "mac-desktop", "ai-agent-apps", "codex", "developer-tools", "personal-apps", "forks"]
touchid_sudo = true
pin_hostname = true
secrets_enabled = true
agent_clis = ["claude", "codex", "omp"]
acpx_routes = ["local", "codex", "claude", "openai", "anthropic", "cerebras", "openrouter"]
granola_mcp = true
agent_session_wiki = true

# Homelab Mac mini: development plus Apple tooling, remote/admin access, and
# AI agent apps (agentsview + Orca need each other to be useful), without the
# full interactive personal desktop surface.
[machines.type.homelab]
groups = ["core", "ai-agent-apps", "codex", "developer-tools", "apple-development", "homelab-overlay"]
pin_hostname = true
# Non-secret Tartelet runner facts consumed by the managed dk.shape.Tartelet.plist
# fragment (verified key encodings from Tartelet source; see the runner plan). The
# secret half (org, App ID, private key, SSH login) is keychain-only and GUI-entered.
runner_vm_name = "tartelet-runner"
runner_vm_count = 1
runner_labels = "tartelet,homelab"
runner_scope = "repo"                  # GitHubRunnerScope rawValue: "organization" | "repo"; repo = one runner per repo
runner_start_on_launch = true
agent_clis = ["claude", "codex", "omp"]
acpx_routes = ["local", "codex", "claude", "openai", "anthropic", "cerebras", "openrouter"]
granola_mcp = true
agent_session_wiki = true

# Managed work Mac: no personal apps, no Apple/iOS toolchain; Jamf elevation and
# the private config overlay.
# omp is excluded: Cortex XDR's BIOC "SOC - AI Apps BTP Mac" (process_start_978)
# matches omp on process start and terminates the whole causality group, which is
# rooted at the terminal's login session, so any apply that reconciles omp plugins
# (see docs/adr/0020-apply-reconciles-plugin-installs.md) kills the terminal. omp
# is not an acpx route here either. The binary still installs via mise; only the
# apply-time plugin reconcile is dropped.
[machines.type.work]
groups = ["core", "mac-desktop", "ai-agent-apps", "developer-tools", "work-apps", "forks"]
touchid_sudo = true
private_overlay = true
elevation = "jamf-self-service"
agent_clis = ["cursor-agent", "claude"]
acpx_routes = ["claude-vertex", "cursor"]
agent_session_wiki = true
agent_session_wiki_sparse = true
tls_inspection = true
# Whitelist the work monorepo's .envrc so direnv skips the per-worktree prompt.
direnv_trust_monorepo = true

# Personal daily-driver MacBook.
[machines.host.prateek-personal-mbp]
wiki_host_alias = "personal-mbp"

# The code volume is reconciled before apply reads destination state.
# See docs/runbooks/host-storage.md. Tart's separate storage path is exported by
# home/dot_config/zsh/dot_zshenv.tmpl and checked by scripts/vm/lib.sh. The
# agentsview and qmd stores are linked from their home paths by
# run_after_34-agent-data-store.sh; zshenv also exports AGENTSVIEW_DATA_DIR.
[machines.host.m4mini]
code_volume_uuid = "8C16DA8F-1B9B-4ADC-9C7D-EFA8FF8B15D7"
tart_home = "/Users/prateek/code/.storage/vms/tart"
winmux_e2e_artifact_root = "/Users/prateek/code/.storage/artifacts/winmux"
agentsview_data_dir = "/Users/prateek/code/.storage/agentsview"
qmd_cache_dir = "/Users/prateek/code/.storage/qmd"
wiki_host_alias = "m4mini"
# The always-on mini is the single writer for the distilled wiki.
agent_session_wiki_ingest = true

# Managed work MacBook (Jamf hostname). Sparse archive clone via the work
# type, so it cannot own the ingest role.
[machines.host.M-D2N572TGQN]
wiki_host_alias = "work-mbp"
