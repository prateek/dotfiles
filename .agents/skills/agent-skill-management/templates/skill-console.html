<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skill Console</title>
<!--
Rendered by `skill-console render`. The CLI replaces the EMBEDDED_DATA marker (the
only double-underscored token in this file, inside the JSON script block near the end)
with one object, escaping "</" as "<\/" first:

  snapshot        Snapshot
  admission       Admission, costs in listing order
  rows            Row[]                          (records as objects, paths as strings)
  divergences     Divergence[]
  entries         ListingEntry[]  optional, listing order; supplies forced_name_only and
                                  the exact listing_text the serializer saw
  packages        PackageRecord[] optional; supplies marketplace and render_claude
  repo_root       string          optional; row ops need a record under this path
  enabled_plugins {"<pkg>@<marketplace>": bool} optional; fallback for the marketplace name
  apm             {"<qualified name>": {apm_dep, dep_owns_skills}} optional; enables delete_skill
  warnings        string[]        optional

Row extension fields the page also reads when present: apm_dep, dep_owns_skills, marketplace.
The page never writes anywhere; exporting the decisions document is its only output.
-->
<style>
:root {
  color-scheme: light;
  --canvas: #f6f7f8; --surface: #ffffff; --surface-2: #f1f3f5; --hover: #f6f7f9;
  --text: #17191c; --text-2: #646a73; --text-3: #8a9099;
  --border: #dfe2e6; --border-2: #c9ced4;
  --sel: #2563eb; --sel-ink: #1d4fc0; --sel-wash: rgba(37,99,235,0.09); --sel-wash-2: rgba(37,99,235,0.18);
  --ok: #16834a; --ok-wash: rgba(22,131,74,0.10);
  --warn: #b66a00; --warn-wash: rgba(182,106,0,0.11);
  --bad: #c93636; --bad-wash: rgba(201,54,54,0.10);
  --prot: #7656c8;
  --full: #596273; --nameonly: #a8afb9; --track: #eceef1; --rule: #17191c;
  --status-bg: #1c1f24; --status-fg: #e7e9ec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #121417; --surface: #1a1d21; --surface-2: #22262b; --hover: #1f2327;
    --text: #e7e9ec; --text-2: #9aa1ab; --text-3: #6f767f;
    --border: #2b3037; --border-2: #3a4048;
    --sel: #5b8def; --sel-ink: #8fb0f5; --sel-wash: rgba(91,141,239,0.16); --sel-wash-2: rgba(91,141,239,0.28);
    --ok: #3fb26f; --ok-wash: rgba(63,178,111,0.14);
    --warn: #d99a3a; --warn-wash: rgba(217,154,58,0.14);
    --bad: #e0605f; --bad-wash: rgba(224,96,95,0.14);
    --prot: #9f88e3;
    --full: #8d97a6; --nameonly: #4a525c; --track: #2a2f35; --rule: #e7e9ec;
    --status-bg: #0c0e11; --status-fg: #d8dbe0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #121417; --surface: #1a1d21; --surface-2: #22262b; --hover: #1f2327;
  --text: #e7e9ec; --text-2: #9aa1ab; --text-3: #6f767f;
  --border: #2b3037; --border-2: #3a4048;
  --sel: #5b8def; --sel-ink: #8fb0f5; --sel-wash: rgba(91,141,239,0.16); --sel-wash-2: rgba(91,141,239,0.28);
  --ok: #3fb26f; --ok-wash: rgba(63,178,111,0.14);
  --warn: #d99a3a; --warn-wash: rgba(217,154,58,0.14);
  --bad: #e0605f; --bad-wash: rgba(224,96,95,0.14);
  --prot: #9f88e3;
  --full: #8d97a6; --nameonly: #4a525c; --track: #2a2f35; --rule: #e7e9ec;
  --status-bg: #0c0e11; --status-fg: #d8dbe0;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--canvas); color: var(--text); }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px; line-height: 19px; -webkit-font-smoothing: antialiased;
  padding-bottom: 64px;
}
.mono, code, kbd.cmd, textarea, input.cmd { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
.mono, code { font-size: 12px; }
h1, h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: var(--sel-ink); }
.spacer { flex: 1; }
.num { font-variant-numeric: tabular-nums; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
.meta { font-size: 11.5px; line-height: 16px; }
.ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .prot { color: var(--prot); } .sel { color: var(--sel-ink); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }

button {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-2);
  border-radius: 6px; padding: 4px 10px; min-height: 28px; cursor: pointer; line-height: 18px;
}
button:hover:not(:disabled) { background: var(--hover); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.primary { background: var(--sel); color: #fff; border-color: var(--sel); }
button.primary:hover:not(:disabled) { filter: brightness(0.94); background: var(--sel); }
button.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
button.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
button.small { min-height: 24px; padding: 2px 8px; font-size: 12px; }
button.danger { color: var(--bad); border-color: var(--bad); }
button kbd { margin-right: 6px; }
kbd {
  font-family: inherit; font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--border-2); color: var(--text-2); display: inline-block; min-width: 18px; text-align: center; vertical-align: 1px;
}
input[type="search"], input[type="text"], input[type="number"], select, textarea {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-2); border-radius: 6px;
  padding: 4px 9px; min-height: 28px;
}
select { padding-right: 24px; }
textarea { width: 100%; min-height: 110px; resize: vertical; line-height: 19px; font-size: 12.5px; padding: 8px 10px; }
textarea:focus { outline: 2px solid var(--sel); outline-offset: 0; border-color: transparent; }

.app { max-width: 1640px; margin: 0 auto; padding: 18px 20px 0; }
.top { display: flex; align-items: flex-start; gap: 14px; }
.top h1 { font-size: 20px; line-height: 28px; font-weight: 650; letter-spacing: -0.01em; }
.top .sub { color: var(--text-2); }
.top .right { display: flex; gap: 8px; align-items: center; }
.health-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); padding: 0 10px; min-height: 28px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
.health-chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.health-chip .dot.warn { background: var(--warn); } .health-chip .dot.bad { background: var(--bad); }

.banners { display: grid; gap: 8px; margin-top: 12px; }
.banner { padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
.banner.warn { background: var(--warn-wash); border-color: transparent; color: var(--text); }
.banner.bad { background: var(--bad-wash); border-color: transparent; color: var(--text); }
.banner b { font-weight: 600; }
.banner .links a { margin-right: 8px; }

.viewbar { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.tabs { display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 8px; padding: 3px; }
.tabs button { border: 0; background: transparent; color: var(--text-2); min-height: 26px; padding: 2px 11px; border-radius: 6px; }
.tabs button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.10); }
.tabs button .n { color: var(--text-3); margin-left: 6px; font-variant-numeric: tabular-nums; }
.tabs button.on .n { color: var(--text-2); }
.lens-label { color: var(--text-3); font-size: 12px; margin-left: 6px; }

.querybar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.querybar input[type="search"] { width: 320px; }
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; min-height: 26px; border-radius: 999px; border: 1px solid var(--border-2); background: var(--surface); font-size: 12px; color: var(--text-2); cursor: pointer; }
.chip.on { background: var(--sel-wash); border-color: var(--sel); color: var(--sel-ink); }
.chip .x { color: var(--text-3); }
.querybar select { min-height: 26px; padding: 2px 24px 2px 8px; font-size: 12px; color: var(--text-2); }

.summary { margin-top: 12px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; display: grid; gap: 4px; }
.summary .line { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.summary .line .lbl { color: var(--text-2); min-width: 108px; }
.summary .line b { font-weight: 600; }
.summary .line .n { font-size: 18px; line-height: 24px; font-weight: 600; margin-right: 3px; }
.summary .line .u { color: var(--text-2); }
.summary .line.staged .lbl { color: var(--sel-ink); }
.summary .line .delta { color: var(--sel-ink); font-weight: 500; }
.summary .hint { color: var(--text-3); font-size: 12px; }

.budget-panel { margin-top: 10px; padding: 12px 14px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.budget-panel .viz { position: relative; }
.budget-panel svg { display: block; width: 100%; overflow: visible; }
.budget-panel .seg.lit { filter: brightness(0.85); }
.budget-panel text { font-family: inherit; font-size: 11px; fill: var(--text-3); }
.budget-panel text.lbl { fill: var(--text-2); }
.budget-panel text.cutlbl { fill: var(--text); font-weight: 500; }
.tip { position: absolute; pointer-events: none; z-index: 3; background: var(--status-bg); color: var(--status-fg); padding: 6px 10px; border-radius: 6px; font-size: 12px; line-height: 17px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,0.2); transform: translate(-50%, calc(-100% - 8px)); }
.tip b { font-size: 13px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; font-size: 11.5px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.legend i.cut { width: 2px; height: 12px; border-radius: 0; background: var(--rule); }
.consequences { margin-top: 10px; font-size: 12.5px; color: var(--text-2); display: grid; gap: 3px; }
.consequences .k { color: var(--text-3); margin-right: 6px; }
.consequences a { margin-right: 8px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 12px; align-items: start; }
.layout.with-inspector { grid-template-columns: minmax(0, 1fr) 400px; }
@media (max-width: 1100px) { .layout.with-inspector { grid-template-columns: minmax(0, 1fr); } .inspector { position: static !important; max-height: none !important; } }
.section-title { font-size: 15px; line-height: 22px; font-weight: 650; margin: 18px 0 8px; display: flex; align-items: baseline; gap: 10px; }
.section-title:first-child { margin-top: 0; }
.section-title .t3 { font-size: 12px; font-weight: 400; }

table.grid { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
table.grid.fixed { table-layout: fixed; }
table.grid.fixed td { overflow: hidden; text-overflow: ellipsis; }
table.grid.fixed tr.pkg td { white-space: normal; }
.tablewrap { overflow-x: auto; border-radius: 8px; }
table.grid th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 11.5px; line-height: 16px; padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--surface); white-space: nowrap; }
table.grid th.n, table.grid td.n { text-align: right; }
table.grid td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 12.5px; line-height: 18px; }
table.grid tr:last-child td { border-bottom: 0; }
table.grid td.gut, table.grid th.gut { width: 26px; padding-left: 8px; padding-right: 0; }
table.grid tr.nav { cursor: default; }
table.grid tr.nav:hover td { background: var(--hover); }
table.grid tr.nav td.gut { position: relative; }
table.grid tr.cur td { background: var(--sel-wash); }
table.grid tr.cur td.gut::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--sel); }
table.grid tr.nav:focus-visible { outline: none; }
table.grid tr.nav:focus-visible td { box-shadow: inset 0 0 0 2px var(--sel); }
table.grid tr.skill td { height: 36px; }
table.grid tr.pkg td { height: 42px; background: var(--surface-2); font-size: 12.5px; }
table.grid tr.pkg.cur td { background: var(--sel-wash-2); }
table.grid tr.pkg .chev { display: inline-block; width: 6px; height: 6px; border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3); transform: rotate(-45deg); margin: 0 2px 1px 0; transition: transform 100ms; }
table.grid tr.pkg.open .chev { transform: rotate(45deg); }
table.grid tr.pkg .pname { font-weight: 650; font-size: 13px; margin-right: 10px; }
table.grid tr.pkg .pmeta { color: var(--text-2); }
table.grid tr.pkg .pmeta .sep { color: var(--text-3); margin: 0 7px; }
table.grid tr.pkg .prow { display: flex; align-items: center; gap: 12px; }
table.grid tr.pkg .ptext { flex: 1; min-width: 0; white-space: normal; }
table.grid tr.pkg .pact { flex: none; white-space: nowrap; }
table.grid tr.pkg .plabel { font-size: 11px; color: var(--text-3); margin-left: 6px; }
table.grid tr.deleted .nm { text-decoration: line-through; color: var(--text-3); }
.mark { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 2px; vertical-align: 0; }
.mark.staged { background: var(--sel); }
.mark.warn { background: var(--warn); }
.mark.bad { background: var(--bad); }
.mark.hollow { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border-2); }
td.skill .nm { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12px; font-weight: 500; }
td.skill .nm .pfx { color: var(--text-3); font-weight: 400; }
td.skill .desc { color: var(--text-2); font-size: 12px; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.skill .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
td.skill .desc.none { color: var(--text-3); font-style: italic; }
td.skill .flags { color: var(--warn); font-size: 11px; margin-left: 8px; }
td.skill .flags.prot { color: var(--prot); }
td.inv, td.harn, td.prov, td.usage, td.health, td.listing, td.decision, td.effect { white-space: nowrap; color: var(--text-2); }
td.inv .off, td.harn .off { color: var(--text-3); }
td.inv .st, td.harn .st, td.listing .st { color: var(--sel-ink); }
td.harn b { font-weight: 600; color: var(--text); margin-right: 7px; }
td.harn b.off { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
td.harn b.unk { color: var(--text-3); font-weight: 400; }
td.usage .t3 { margin-left: 6px; }
td.health .ok { color: var(--ok); } td.health .warn { color: var(--warn); }
td.listing .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--full); vertical-align: 0; }
td.listing .dot.name-only { background: var(--nameonly); }
td.listing .dot.unlisted { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border-2); }
td.listing .dot.protected { background: var(--prot); }
td.listing .was { color: var(--text-3); } td.listing .was::after { content: " \2192 "; }
td.listing .why { color: var(--text-3); font-size: 11.5px; margin-left: 6px; }
td.effect .up { color: var(--ok); } td.effect .down { color: var(--warn); }
.empty { padding: 26px 16px; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.empty b { color: var(--text); }
.diag { color: var(--text-3); font-size: 11.5px; line-height: 16px; margin-top: 14px; }

.inspector { position: sticky; top: 14px; max-height: calc(100vh - 62px); overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px 16px; }
.inspector .ihead { display: flex; align-items: flex-start; gap: 10px; }
.inspector .ihead .title { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.inspector .ihead .badges { margin-top: 3px; font-size: 11.5px; color: var(--text-2); display: flex; gap: 8px; flex-wrap: wrap; }
.inspector .pin { color: var(--text-3); }
.inspector .pin.on { color: var(--sel-ink); }
.inspector section { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
.inspector section h3 { font-size: 11.5px; line-height: 16px; font-weight: 600; color: var(--text-3); letter-spacing: 0; margin-bottom: 7px; }
.inspector .kv { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 3px 10px; font-size: 12.5px; }
.inspector .kv .k { color: var(--text-2); }
.inspector .kv .v { color: var(--text); word-break: break-word; }
.inspector .kv .v .src { color: var(--text-3); margin-left: 6px; font-size: 11.5px; }
.inspector .desc-ro { font-size: 12.5px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
.inspector .why { color: var(--text-3); font-size: 12px; margin-top: 5px; }
.inspector .counters { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.inspector .counters .delta { color: var(--text); }
.inspector .counters .bad { color: var(--bad); }
.inspector .draft-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.inspector .actions { display: grid; gap: 6px; }
.inspector .actions button { text-align: left; justify-content: flex-start; }
.inspector .actions .na { color: var(--text-3); font-size: 12px; padding: 2px 0; }
.inspector .actions .na b { color: var(--text-2); font-weight: 500; }
.inspector .tree { display: grid; grid-template-columns: 84px minmax(0, 1fr) 68px; gap: 2px 8px; font-size: 12px; }
.inspector .tree .path { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.inspector .tree .hash { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; }
.inspector .divs { margin-top: 6px; color: var(--warn); font-size: 12px; }
.inspector .note { font-size: 12px; color: var(--text-2); margin-top: 6px; }

.status { position: fixed; left: 0; right: 0; bottom: 0; height: 28px; background: var(--status-bg); color: var(--status-fg); display: flex; align-items: center; gap: 18px; padding: 0 14px; font-size: 12px; z-index: 15; font-variant-numeric: tabular-nums; }
.status .mode { font-weight: 700; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 4px; background: var(--sel); color: #fff; font-size: 11px; }
.status .mode.insert { background: var(--ok); } .status .mode.command { background: var(--warn); color: #111; } .status .mode.confirm { background: var(--bad); }
.status .mono { font-size: 12px; }
.status .dim { opacity: 0.6; }
.status .err { color: #ff9b9b; }
.status input.cmd { flex: 1; background: transparent; border: 0; color: var(--status-fg); font-size: 12px; padding: 0; min-height: 0; outline: none; }
.prompt { position: fixed; left: 0; right: 0; bottom: 28px; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 16px; z-index: 14; display: flex; gap: 16px; align-items: center; box-shadow: 0 -6px 20px rgba(0,0,0,0.08); font-size: 13px; }
.prompt .msg { flex: 1; }
.prompt.danger { border-top-color: var(--bad); }
.prompt .keys { color: var(--text-2); white-space: nowrap; }

.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.38); display: flex; align-items: center; justify-content: center; z-index: 20; }
.sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; width: 720px; }
.sheet.wide { width: 960px; max-width: calc(100vw - 40px); max-height: calc(100vh - 80px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
.sheet h2 { font-size: 15px; line-height: 22px; font-weight: 650; margin-bottom: 12px; }
.sheet .foot { margin-top: 16px; display: flex; gap: 10px; align-items: center; color: var(--text-2); font-size: 12px; }
.help-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 24px; font-size: 12.5px; }
.help-cols h4 { margin: 0 0 6px; font-size: 11.5px; color: var(--text-3); font-weight: 600; }
.help-cols .row { display: flex; gap: 8px; padding: 2px 0; align-items: baseline; }
.help-cols .row .k { min-width: 118px; display: inline-flex; gap: 3px; flex-wrap: wrap; }
.help-cols .row .d { color: var(--text-2); }
.sheet .kv { display: grid; grid-template-columns: 170px 1fr; gap: 4px 12px; font-size: 12.5px; }
.sheet .kv .k { color: var(--text-2); }
.sheet .warns { margin-top: 10px; color: var(--warn); font-size: 12.5px; display: grid; gap: 3px; }

<script type="application/json" id="embedded-data">__EMBEDDED_DATA__</script>
<script>
"use strict";

let APP_READY = false;
addEventListener("error", (ev) => {
  if (document.querySelector(".fatal")) return;
  if (APP_READY) {
    console.error(ev.error || ev.message);
    const st = document.getElementById("status");
    if (st) { const err = document.createElement("span"); err.className = "err"; err.textContent = `error: ${ev.message}`; st.append(err); }
    return;
  }
  const box = document.createElement("div");
  box.className = "fatal";
  const title = document.createElement("h2");
  title.textContent = "Could not open this skill snapshot";
  const msg = document.createElement("p");
  msg.textContent = String(ev.message || ev.error || "unknown error");
  const hint = document.createElement("p");
  hint.textContent = "Regenerate the page with skill-console render …";
  const pre = document.createElement("pre");
  pre.textContent = ev.error && ev.error.stack ? ev.error.stack : String(ev.message);
  box.append(title, msg, hint, pre);
  document.body.replaceChildren(box);
});

// skill-console:admit-begin
// Port of Claude Code's per(): greedy admission over integer costs Python already measured.
// entries: [{name, name_only_cost, full_cost, upgrade_cost, protected, forced_name_only, rank}] in listing order.
function admit(entries, budget) {
  const n = entries.length;
  if (n === 0) {
    return { mode: "fits", budget, demand_chars: 0, rendered_chars: 0, headroom_chars: budget,
             all_pinned: false, full: [], name_only: [], rendered: {} };
  }
  const separators = n - 1;
  // A forced name-only row's "full" line is already its name-only line, so it is charged as such everywhere.
  const shown = (i) => (entries[i].forced_name_only ? entries[i].name_only_cost : entries[i].full_cost);
  const pinned = new Set();
  let demand = separators;
  for (let i = 0; i < n; i++) {
    if (entries[i].forced_name_only) pinned.add(i);
    demand += shown(i);
  }
  const result = (mode, renderedChars, allPinned, isFull) => {
    const full = [], name_only = [], rendered = {};
    for (let i = 0; i < n; i++) {
      const state = isFull(i) ? "full" : "name-only";
      (state === "full" ? full : name_only).push(entries[i].name);
      rendered[entries[i].name] = state;
    }
    return { mode, budget, demand_chars: demand, rendered_chars: renderedChars,
             headroom_chars: budget - renderedChars, all_pinned: allPinned, full, name_only, rendered };
  };
  if (demand <= budget) return result("fits", demand, false, (i) => !pinned.has(i));
  for (let i = 0; i < n; i++) if (entries[i].protected) pinned.add(i);
  const candidates = [];
  for (let i = 0; i < n; i++) if (!pinned.has(i)) candidates.push(i);
  let baseline = separators;
  for (let i = 0; i < n; i++) baseline += pinned.has(i) ? shown(i) : entries[i].name_only_cost;
  if (candidates.length === 0) return result("priority", baseline, true, (i) => !entries[i].forced_name_only);
  // Stable sort over ascending indices: equal ranks keep listing order.
  candidates.sort((a, b) => entries[b].rank - entries[a].rank);
  let headroom = budget - baseline;
  const admitted = new Set();
  for (const i of candidates) {
    const cost = entries[i].upgrade_cost;
    if (cost <= headroom) { admitted.add(i); headroom -= cost; }
  }
  return result("priority", budget - headroom, false,
                (i) => (pinned.has(i) && !entries[i].forced_name_only) || admitted.has(i));
}
// skill-console:admit-end

const DATA = JSON.parse(document.getElementById("embedded-data").textContent);
const SNAP = DATA.snapshot;
const ADM = DATA.admission;
// An infinite env budget arrives as the string "Infinity" because JSON has no literal for it.
for (const [obj, key] of [[SNAP, "budget_chars"], [SNAP, "budget_env_override"], [ADM, "budget"], [ADM, "headroom_chars"]]) {
  if (typeof obj[key] === "string") obj[key] = Number(obj[key]);
}
const ROWS = DATA.rows || [];
const DIVERGENCES = DATA.divergences || [];
const ENTRIES = DATA.entries || null;
const PACKAGES = DATA.packages || [];
const ENABLED_PLUGINS = DATA.enabled_plugins || {};
const MAX_DESC_CHARS = SNAP.max_desc_chars;
const ELLIPSIS = "…";
const CAPTURE = DATA.capture || null;
const ROW_OPS = ["set_description", "set_frontmatter", "delete_skill"];
// The capability matrix is owned by skill_console/__init__.py; this literal only covers a payload without it.
const CAPABILITIES = Object.fromEntries(Object.entries(DATA.capabilities || {
  "repo-local": ["set_description", "set_frontmatter", "set_default_loaded", "set_package_enabled"],
  "repo-vendor": ["set_description", "set_frontmatter", "delete_skill", "set_default_loaded", "set_package_enabled"],
  "repo-project": ["set_description", "set_frontmatter"],
  "user-skill": [],
  "user-command": [],
  "third-party-plugin": ["set_package_enabled"],
  "builtin": [],
}).map(([origin, allowed]) => [origin, new Set(allowed)]));
const REGISTRY_ORIGINS = new Set(["builtin", "user-skill", "user-command", "repo-project"]);

// ---- Measurement, restricted to text write_safe() accepts ------------------------------------
// Under write_safe every code point is a newline or a lone BMP character Bun draws at width one:
// no astral, Mn/Me/Cf, control, wide, or zero-width code points, so none of Bun.stringWidth's
// grapheme rules can fire and the width is "one per UTF-16 unit, zero for newlines". Anything
// outside that class is refused here rather than measured approximately; Python's write_safe is
// the authority. WIDE_RE is the BMP portion of East_Asian_Width W and F (Unicode 16); ZERO_RE is
// the BMP part of budget.py's zero-width table beyond Mn/Me/Cf (Hangul jungseong/jongseong and the
// Indic spacing signs Bun's table zeroes); astral is refused separately.
const WIDE_RE = /[\u1100-\u115F\u231A-\u231B\u2329-\u232A\u23E9-\u23EC\u23F0\u23F3\u25FD-\u25FE\u2614-\u2615\u2630-\u2637\u2648-\u2653\u267F\u268A-\u268F\u2693\u26A1\u26AA-\u26AB\u26BD-\u26BE\u26C4-\u26C5\u26CE\u26D4\u26EA\u26F2-\u26F3\u26F5\u26FA\u26FD\u2705\u270A-\u270B\u2728\u274C\u274E\u2753-\u2755\u2757\u2795-\u2797\u27B0\u27BF\u2B1B-\u2B1C\u2B50\u2B55\u2E80-\u2E99\u2E9B-\u2EF3\u2F00-\u2FD5\u2FF0-\u303E\u3041-\u3096\u3099-\u30FF\u3105-\u312F\u3131-\u318E\u3190-\u31E5\u31EF-\u321E\u3220-\u3247\u3250-\uA48C\uA490-\uA4C6\uA960-\uA97C\uAC00-\uD7A3\uF900-\uFAFF\uFE10-\uFE19\uFE30-\uFE52\uFE54-\uFE66\uFE68-\uFE6B\uFF01-\uFF60\uFFE0-\uFFE6]/;
const ZERO_WIDTH_RE = /[\p{Mn}\p{Me}\p{Cf}]/u;
const ZERO_RE = /[\u093B\u093E-\u0940\u0949-\u094C\u0980\u0982\u09BA-\u09BB\u09BE-\u09C0\u09C5-\u09CC\u09D1-\u09D7\u0A00\u0A3A-\u0A3B\u0A3E-\u0A40\u0A43-\u0A46\u0A49-\u0A4A\u0A52-\u0A57\u0A62-\u0A63\u0A80\u0ABA-\u0ABB\u0ABE-\u0AC0\u0AC6\u0AC9-\u0ACC\u0AD1-\u0AD7\u0B00\u0B02\u0B3A-\u0B3B\u0B3E\u0B40\u0B45-\u0B4C\u0B51-\u0B54\u0B57\u0B80-\u0B81\u0BBA-\u0BBC\u0BBE-\u0BBF\u0BC1-\u0BCC\u0BD1-\u0BD7\u0BE2-\u0BE3\u0C01-\u0C02\u0C3A-\u0C3B\u0C41-\u0C45\u0C49\u0C51-\u0C54\u0C57\u0C80\u0C82\u0CBA-\u0CBB\u0CBE\u0CC0-\u0CC5\u0CC7-\u0CCB\u0CD1-\u0CD7\u0D02\u0D3A\u0D3E-\u0D40\u0D45-\u0D4C\u1160-\u11FF\u1ACF-\u1AFF\u2065\u20F1-\u20FF\uD7B0-\uD7FF]/u;
const ASTRAL_RE = /[\u{10000}-\u{10FFFF}]|\p{Cs}/u;
const CONTROL_RE = /\p{Cc}/gu;
const OTHER_CONTROL_RE = /[^\P{Cc}\n]/u;

function writeSafe(text) {
  if (ASTRAL_RE.test(text)) return [false, "astral code point (emoji, supplementary plane)"];
  if (OTHER_CONTROL_RE.test(text)) return [false, "control character (only newline is allowed)"];
  if (ZERO_WIDTH_RE.test(text)) return [false, "combining mark, ZWJ, or variation selector"];
  if (WIDE_RE.test(text)) return [false, "East Asian wide or fullwidth character"];
  if (ZERO_RE.test(text)) return [false, "zero-width character"];
  return [true, ""];
}
function safeWidth(text) { return text.length - (text.match(CONTROL_RE) || []).length; }
function listingText(description, whenToUse) { return whenToUse ? `${description} - ${whenToUse}` : description; }
function capText(text) {
  return text.length > MAX_DESC_CHARS ? [text.slice(0, MAX_DESC_CHARS - 1) + ELLIPSIS, true] : [text, false];
}
function fullCostFor(nameOnlyCost, text) {
  const [capped, wasCapped] = capText(text);
  return { full_cost: nameOnlyCost + 2 + safeWidth(capped), capped: wasCapped };
}
function computedBudget(fraction) {
  return Math.max(1, Math.floor(SNAP.context_window * SNAP.bytes_per_token * fraction));
}
const envBudgetActive = SNAP.budget_env_override !== null && SNAP.budget_env_override !== undefined && SNAP.budget_env_override !== 0;

// ---- Models ----------------------------------------------------------------------------------
const costByName = new Map();
(ADM.costs || []).forEach((c) => costByName.set(c.name, c));
const entryByName = new Map();
if (ENTRIES) ENTRIES.forEach((e, i) => entryByName.set(e.name, { ...e, index: i }));
const packageInfo = new Map();
PACKAGES.forEach((p) => packageInfo.set(p.name, p));
const apmByName = new Map(Object.entries(DATA.apm || {}));

function liveRecord(row) { return row.cache_record || row.marketplace_record || row.source_record || null; }
function editRecord(row) { return row.source_record || row.marketplace_record || row.cache_record || null; }
function inRepo(record) { return Boolean(record && DATA.repo_root && String(record.path).startsWith(DATA.repo_root + "/")); }

function marketplaceFor(pkg, row) {
  const info = packageInfo.get(pkg);
  if (info && info.marketplace) return info.marketplace;
  const key = Object.keys(ENABLED_PLUGINS).find((k) => k.startsWith(pkg + "@"));
  if (key) return key.slice(pkg.length + 1);
  if (row && row.marketplace) return row.marketplace;
  return null;
}

const models = ROWS.map((row) => {
  const cost = costByName.get(row.name) || null;
  const entry = entryByName.get(row.name) || null;
  const live = liveRecord(row);
  const edit = editRecord(row);
  const text = entry ? entry.listing_text : (live ? listingText(live.description, live.when_to_use) : null);
  const claudeEnabled = row.live_enabled && typeof row.live_enabled.claude === "boolean" ? row.live_enabled.claude : null;
  const liveDmi = row.listed ? false : Boolean(live && live.disable_model_invocation);
  const apm = apmByName.get(row.name) || (row.apm_dep ? { apm_dep: row.apm_dep, dep_owns_skills: row.dep_owns_skills } : null);
  let unlistedReason = null;
  if (!row.listed) {
    if (claudeEnabled === false) unlistedReason = "package";
    else if (liveDmi) unlistedReason = "disable-model-invocation";
    else unlistedReason = "not loaded by Claude (cache drift, scope, or override)";
  }
  const [safe, safeReason] = text === null ? [false, "no description text in payload"] : writeSafe(text);
  return {
    row, name: row.name, pkg: row.package || "", origin: row.origin, protected: Boolean(row.protected),
    listed: Boolean(row.listed), index: cost ? cost.index : (entry ? entry.index : null),
    cost, entry, text, edit, live, liveDmi, claudeEnabled, apm, unlistedReason,
    measurable: safe, measureReason: safeReason,
    rank: Number(row.rank) || 0,
    forced: Boolean(entry && entry.forced_name_only),
    renderedBefore: row.listed ? (ADM.rendered && ADM.rendered[row.name]) || row.rendered || null : null,
    costAfter: null, changed: false, pkgModel: null, el: {},
  };
});
const modelByName = new Map(models.map((m) => [m.name, m]));

const listedModels = models.filter((m) => m.listed && m.cost).sort((a, b) => a.index - b.index);

const packages = new Map();
models.forEach((m) => {
  const key = m.pkg || m.origin;
  if (!packages.has(key)) {
    packages.set(key, {
      key, name: m.pkg, isPackage: Boolean(m.pkg), rows: [], origins: new Set(),
      marketplace: m.pkg ? marketplaceFor(m.pkg, m.row) : null,
      defaultLoaded: null, liveEnabled: null, info: packageInfo.get(m.pkg) || null,
      firstIndex: Infinity, el: {},
    });
  }
  const p = packages.get(key);
  p.rows.push(m);
  p.origins.add(m.origin);
  if (typeof m.row.repo_default === "boolean") p.defaultLoaded = m.row.repo_default;
  if (m.claudeEnabled !== null) p.liveEnabled = m.claudeEnabled;
  if (m.index !== null && m.index < p.firstIndex) p.firstIndex = m.index;
  m.pkgModel = p;
});
packages.forEach((p) => {
  if (p.info && typeof p.info.default_loaded === "boolean") p.defaultLoaded = p.info.default_loaded;
  if (p.liveEnabled === null && p.isPackage) {
    const key = p.marketplace ? `${p.name}@${p.marketplace}` : null;
    p.liveEnabled = key && key in ENABLED_PLUGINS ? Boolean(ENABLED_PLUGINS[key]) : p.rows.some((m) => m.listed);
  }
  p.rows.sort((a, b) => {
    if (a.index !== null && b.index !== null) return a.index - b.index;
    if (a.index !== null) return -1;
    if (b.index !== null) return 1;
    return a.name.localeCompare(b.name);
  });
});
const packageOrder = [...packages.values()].sort((a, b) => {
  if (a.firstIndex !== b.firstIndex) return a.firstIndex - b.firstIndex;
  return a.key.localeCompare(b.key);
});

function entryFromModel(m, override) {
  const c = override || m.cost;
  return { name: m.name, name_only_cost: c.name_only_cost, full_cost: c.full_cost, upgrade_cost: c.upgrade_cost,
           protected: m.protected, forced_name_only: m.forced, rank: m.rank };
}
const BEFORE = admit(listedModels.map((m) => entryFromModel(m)), ADM.budget);

// ---- Staged operations -----------------------------------------------------------------------
const ops = new Map();
const opKey = (op, key) => `${op} ${key}`;
// PREVIEW overlays a hypothetical op (an unsaved draft) so the simulation can answer "what if" without staging.
let PREVIEW = null;
function getOp(op, key) {
  const k = opKey(op, key);
  if (PREVIEW && PREVIEW.has(k)) return PREVIEW.get(k);
  return ops.get(k) || null;
}
const HISTORY = [], REDO = [];
function record(key, before, after) { HISTORY.push({ key, before, after }); REDO.length = 0; }
function setOp(o) { const k = opKey(o.op, o.key); record(k, ops.get(k) || null, o); ops.set(k, o); recompute(); }
function delOp(op, key) { const k = opKey(op, key); if (!ops.has(k)) return; record(k, ops.get(k), null); ops.delete(k); recompute(); }
function undo() {
  const e = HISTORY.pop();
  if (!e) return null;
  REDO.push(e);
  if (e.before) ops.set(e.key, e.before); else ops.delete(e.key);
  recompute();
  return e;
}
function redo() {
  const e = REDO.pop();
  if (!e) return null;
  HISTORY.push(e);
  if (e.after) ops.set(e.key, e.after); else ops.delete(e.key);
  recompute();
  return e;
}

function packageEnabledOp(p) {
  return p.marketplace ? getOp("set_package_enabled", `${p.name}@${p.marketplace}`) : null;
}
// enabledPlugins is merged after the generated default_loaded fragment, so it wins when both are staged.
function packageEnabledAfter(p) {
  if (!p || !p.isPackage) return true;
  const en = packageEnabledOp(p);
  if (en) return en.value;
  const dl = getOp("set_default_loaded", p.name);
  if (dl) return dl.value;
  return p.liveEnabled !== false;
}
function packageDisabledInBatch(p) {
  if (!p || !p.isPackage) return false;
  const en = packageEnabledOp(p);
  const dl = getOp("set_default_loaded", p.name);
  return Boolean((en && en.value === false) || (dl && dl.value === false));
}
function rowEditsInPackage(p) {
  return p.rows.filter((m) => getOp("set_description", m.name) || getOp("set_frontmatter", m.name));
}

function refusal(m, op) {
  if (!CAPABILITIES[m.origin] || !CAPABILITIES[m.origin].has(op)) return `${m.origin} rows do not permit ${op}`;
  if (ROW_OPS.includes(op) && !m.listed) return "not in the live listing (V13)";
  if (ROW_OPS.includes(op) && !inRepo(m.edit)) return "not in this checkout's source tree; edit it where it lives (V13)";
  if (op === "set_description" || op === "set_frontmatter") {
    if (getOp("delete_skill", m.name)) return "delete_skill staged for this skill (V15)";
    if (packageDisabledInBatch(m.pkgModel)) return "package disabled in this batch (V15)";
  }
  if (op === "set_description") {
    if (!m.edit) return "no source record to edit";
    if (m.text === null) return "live listing text unknown, cannot compute from_chars";
  }
  if (op === "delete_skill") {
    if (getOp("set_description", m.name)) return "set_description staged for this skill (V15)";
    if (!m.apm) return "no APM dependency recorded in its SOURCE.md";
    if (m.apm.dep_owns_skills !== 1) return `APM dependency owns ${m.apm.dep_owns_skills} skills; needs the exclusion mechanism`;
  }
  return null;
}
function packageRefusal(p, op) {
  if (!p.isPackage) return `${p.key} rows have no package`;
  const permitted = [...p.origins].every((o) => CAPABILITIES[o] && CAPABILITIES[o].has(op));
  if (!permitted) return `${[...p.origins].join(", ")} rows do not permit ${op}`;
  if (op === "set_package_enabled") {
    if (!p.marketplace) return "marketplace unknown; payload lacks packages[] or enabled_plugins";
    if (p.info && p.info.render_claude && p.info.render_claude !== "plugin") return `render.claude is "${p.info.render_claude}", not a Claude plugin`;
  }
  if (op === "set_default_loaded" && p.defaultLoaded === null) return "package.toml default_loaded unknown";
  const target = op === "set_default_loaded" ? !p.defaultLoaded : !(p.liveEnabled !== false);
  if (target) {
    const unmeasurable = p.rows.filter((m) => !m.listed && m.unlistedReason === "package" && !m.measurable);
    if (unmeasurable.length) return `cannot simulate: ${unmeasurable.map((m) => m.name).join(", ")} has ${unmeasurable[0].measureReason}`;
  } else {
    const edits = rowEditsInPackage(p);
    if (edits.length) return `${edits.length} staged skill edit(s) in this package would conflict (V15); clear them first`;
  }
  return null;
}

// ---- Simulation ------------------------------------------------------------------------------
function listedAfter(m) {
  if (getOp("delete_skill", m.name)) return false;
  const fm = getOp("set_frontmatter", m.name);
  let dmi = m.liveDmi;
  if (fm && fm.field === "disable-model-invocation") dmi = fm.value;
  if (dmi) return false;
  if (!packageEnabledAfter(m.pkgModel)) return false;
  if (m.listed) return true;
  return m.unlistedReason === "package";
}

function afterCost(m) {
  const desc = getOp("set_description", m.name);
  if (!desc && m.cost) return m.cost;
  const description = desc ? desc.text : m.edit.description;
  const whenToUse = m.edit ? m.edit.when_to_use : null;
  const nameOnly = m.cost ? m.cost.name_only_cost : safeWidth(m.name) + 2;
  const { full_cost, capped } = fullCostFor(nameOnly, listingText(description, whenToUse));
  return { name: m.name, name_only_cost: nameOnly, full_cost, upgrade_cost: full_cost - nameOnly, capped, estimated: true };
}

function afterEntries() {
  const kept = listedModels.filter((m) => listedAfter(m));

// ---- Budget lens panel -----------------------------------------------------------------------
// Segments follow the greedy loop, not the listing: pinned rows first, then candidates by rank with
// the admitted ones before the ones that fell off. Every rendered row is a solid segment (a name-only
// row is its name-only stub) so the solid run ends exactly at rendered_chars; the hatched ghosts that

function barSegments(entries, adm) {

  candidates.sort((a, b) => (b.e.rank - a.e.rank) || (a.i - b.i));
  const admitted = candidates.filter((c) => rendered[c.e.name] === "full");
  const skipped = candidates.filter((c) => rendered[c.e.name] !== "full");
  const solid = [
    ...pinned.map((c) => ({ ...c, kind: c.e.forced_name_only ? "forced" : "protected", cost: c.e.forced_name_only ? c.e.name_only_cost : c.e.full_cost })),
    ...admitted.map((c) => ({ ...c, kind: "full", cost: c.e.full_cost })),
    ...skipped.map((c) => ({ ...c, kind: "name-only", cost: c.e.name_only_cost })),

  solid.forEach((c, k) => {
    const span = c.cost + (k < solid.length - 1 ? 1 : 0);
    segs.push({ name: c.e.name, kind: c.kind, cost: c.cost, start: x, end: x + span, ghost: false, entry: c.e });
    x += span;

  skipped.forEach((c) => { segs.push({ name: c.e.name, kind: "name-only", cost: c.e.full_cost, start: x, end: x + c.e.upgrade_cost, ghost: true, entry: c.e }); x += c.e.upgrade_cost; });

}

  if (exportBlocked()) { toast(exportBlocked()); return; }
  const doc = { schema_version: 1, harness: "claude", snapshot: SNAP, predicted: PREDICTED, operations: [...ops.values()] };
  const blob = new Blob([JSON.stringify(doc, null, 2) + "\n"], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: `skill-console-decisions-${exportStamp}.json` });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  closeModal();
  toast("decisions JSON downloaded; nothing on disk changed");
}

// ---- Actions ---------------------------------------------------------------------------------
const cursorSkill = () => { const n = cursorNode(); return n && n.kind === "skill" ? n.m : null; };
const cursorPackage = () => { const n = cursorNode(); return n ? (n.kind === "pkg" ? n.p : n.kind === "skill" ? n.p : null) : null; };
function stagePackage(p, op) {
  if (!p || !p.isPackage) { toast(p ? `${p.label} is not a package; nothing to toggle` : "select a package or a skill inside one"); return; }
  const blocked = stagingBlocked();
  if (blocked) { toast(blocked); return; }
  const key = op === "set_default_loaded" ? p.name : `${p.name}@${p.marketplace}`;
  if (getOp(op, key)) { delOp(op, key); toast(`undone: ${op} on ${key}`); return; }
  const why = packageRefusal(p, op);
  if (why) { showPrompt({ text: `Cannot stage ${op} on ${p.name}: ${why}.` }); return; }
  const live = op === "set_default_loaded" ? p.defaultLoaded : p.liveEnabled !== false;
  const o = { op, target: "package", key, value: !live };
  const sim = simulate(new Map([[opKey(op, key), o]]));
  const listedNow = p.rows.filter((m) => listedAfter(m)).length;
  const listedThen = p.rows.filter((m) => sim.after.rendered[m.name]).length;
  const fx = [`${p.rows.length} skills`, `Claude listed ${listedNow} → ${listedThen}`, `full ${AFTER.full.length} → ${sim.after.full.length}`, `name-only ${AFTER.name_only.length} → ${sim.after.name_only.length}`];
  const en = packageEnabledOp(p);
  const text = op === "set_default_loaded"
    ? `Stage default_loaded → ${!live} for ${p.name}? Changes package.toml and the regenerated Claude, Codex, and pi policy; it may also activate this package's commands, agents, hooks, and MCP servers. ${en ? `A staged enabledPlugins override (${en.value}) wins over this default. ` : (p.marketplace && `${p.name}@${p.marketplace}` in ENABLED_PLUGINS ? `The managed enabledPlugins override (${ENABLED_PLUGINS[`${p.name}@${p.marketplace}`]}) wins over this default. ` : "")}${fx.join(" · ")}.`
    : `Stage enabledPlugins ${key} → ${!live}? Managed Claude override; Codex and pi are unaffected. ${fx.join(" · ")}.`;
  showPrompt({ text, onConfirm: () => setOp(o) });
}
function toggleFlag(m, field) {
  if (!m) { toast("select a skill first"); return; }
  const blocked = stagingBlocked();
  if (blocked) { toast(blocked); return; }
  const staged = getOp("set_frontmatter", m.name);
  if (staged && staged.field === field) { delOp("set_frontmatter", m.name); toast(`undone: ${field} on ${m.name}`); return; }
  if (staged) { showPrompt({ text: `One set_frontmatter per skill per document (V7): ${staged.field} → ${staged.value} is already staged for ${m.name}. Undo it (u) or remove it in Changes (c, then d) before staging ${field}.` }); return; }
  const why = refusal(m, "set_frontmatter");
  if (why) { showPrompt({ text: `Cannot change ${field} on ${m.name}: ${why}.` }); return; }
  const inv = invocation(m);
  const value = field === "disable-model-invocation" ? Boolean(inv.model) : !inv.user;
  const o = { op: "set_frontmatter", target: "skill", key: m.name, field, value };
  let text;
  if (field === "disable-model-invocation") {
    const sim = simulate(new Map([[opKey("set_frontmatter", m.name), o]]));
    text = `Stage disable-model-invocation: ${value}? Claude, pi, and Cursor ${value ? "stop listing it to" : "list it to"} the model; Codex behavior depends on an OpenAI sidecar; user invocation is unchanged. Claude: ${listingAfter(m)} → ${sim.after.rendered[m.name] || "unlisted"}, full ${AFTER.full.length} → ${sim.after.full.length}, name-only ${AFTER.name_only.length} → ${sim.after.name_only.length}.`;
  } else {
    text = `Stage user-invocable: ${value}? ${value ? "Shows" : "Hides"} the Claude slash command; it does not change the model listing or reclaim budget. pi and Codex ignore this field.`;
  }
  showPrompt({ text, onConfirm: () => setOp(o) });
}
function deleteSkill(m) {
  if (!m) { toast("select a skill first"); return; }
  const blocked = stagingBlocked();
  if (blocked) { toast(blocked); return; }
  if (getOp("delete_skill", m.name)) { showPrompt({ text: `Undo the staged delete of ${m.name}?`, onConfirm: () => delOp("delete_skill", m.name) }); return; }
  const why = refusal(m, "delete_skill");
  if (why) {
    const apm = m.apm && m.apm.dep_owns_skills !== 1 ? ` APM dependency ${m.apm.apm_dep} owns ${m.apm.dep_owns_skills} skills; re-vendoring would restore this directory. A durable exclusion mechanism is required.` : "";
    showPrompt({ text: `Cannot delete ${m.name}: ${why}.${apm}` });
    return;
  }
  showPrompt({ danger: true, confirmKeys: ["Enter", "x"], keysText: "Enter or x confirm · Esc cancel",
    text: `Delete ${m.name} and its APM dependency ${m.apm.apm_dep}? Removes the skill directory, the apm.yml dependency, and its lockfile entry; apply reruns reference checks; export still writes nothing.`,
    onConfirm: () => setOp({ op: "delete_skill", target: "skill", key: m.name, apm_dep: m.apm.apm_dep, dep_owns_skills: m.apm.dep_owns_skills, remove_apm_dep: true }) });
}
function doUndo() { const e = undo(); toast(e ? `undone: ${describeOp(e.after || e.before)}` : "nothing to undo"); }
function doRedo() { const e = redo(); toast(e ? `redone: ${describeOp(e.after || e.before)}` : "nothing to redo"); }
function removeCurrentOp() { const n = cursorNode(); if (n && n.kind === "op") delOp(n.o.op, n.o.key); else toast("move the cursor onto a staged operation"); }
function openCurrent() {
  const n = cursorNode();
  if (!n) return;
  if (n.kind === "pkg") { if (S.view === "skills") { S.inspectorOpen = true; togglePackage(n.p); } else { S.inspectorOpen = true; renderMain(); paintCursor(false); } return; }
  if (n.kind === "skill") { S.inspectorOpen = true; renderMain(); paintCursor(false); }
}
function collapseCurrent() {
  const p = cursorPackage();
  if (!p || S.view !== "skills") return;
  S.expanded.set(p.key, false);
  S.searchExpanded.delete(p.key);
  S.cursorId = p.id;
  render();
}
function zCommand(key) {
  const p = cursorPackage();
  if (key === "R") { setAllExpanded(true); return; }
  if (key === "M") { setAllExpanded(false); return; }
  if (!p) return;
  if (key === "a") { togglePackage(p); if (!isExpanded(p)) { S.cursorId = p.id; paintCursor(false); } }
  else if (key === "o") { S.expanded.set(p.key, true); render(); }
  else if (key === "c") collapseCurrent();
}
function escapeNormal() {
  if (S.search) { S.search = ""; if (searchInput) searchInput.value = ""; onSearchChanged(); return; }
  if (S.cmdError) { S.cmdError = ""; renderStatus(); return; }
  if (S.inspectorOpen && S.view !== "changes") { S.inspectorOpen = false; renderMain(); paintCursor(false); }
}
function focusSearch() { if (!searchInput || $("querybar").hidden) { setView("skills"); } searchInput.focus(); searchInput.select(); }
function allMatches() {
  if (!S.search.trim()) return [];
  const out = [];
  orderedPackages().forEach((p) => sortedRows(p).forEach((m) => { if (rowPasses(m)) out.push(m); }));
  return out;
}
function nextMatch(dir) {
  const matches = allMatches();
  if (!matches.length) { toast(S.search ? "no matches" : "no search; press / first"); return; }
  const cur = cursorSkill();
  let i = cur ? matches.indexOf(cur) : -1;
  i = i < 0 ? (dir > 0 ? 0 : matches.length - 1) : (i + dir + matches.length) % matches.length;
  const m = matches[i];
  if (!isExpanded(m.pkgModel)) { S.searchExpanded.add(m.pkgModel.key); render(); }
  setCursor(m.id);
}

// ---- Command line ----------------------------------------------------------------------------
function openCommandLine() {
  if (!cmdInput) {
    cmdInput = h("input", { type: "text", class: "cmd", autocomplete: "off", spellcheck: "false", "aria-label": "command" });
    cmdInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); runCommand(cmdInput.value.trim()); }
      else if (ev.key === "Escape") { ev.preventDefault(); closeCommandLine(); }
      ev.stopPropagation();
    });
  }
  cmdInput.value = "";
  S.cmdError = "";
  setMode("COMMAND");
  cmdInput.focus();
}
function closeCommandLine() { S.cmdError = ""; setMode("NORMAL"); if (document.activeElement === cmdInput) cmdInput.blur(); }
function runCommand(text) {
  const [cmd, ...rest] = text.split(/\s+/);
  const arg = rest.join(" ");
  const ok = () => closeCommandLine();
  switch (cmd) {
    case "w": if (!S.draft) { S.cmdError = "no draft to write"; renderStatus(); return; } ok(); stageDraft({}); return;
    case "q": ok(); if (S.draft) discardDraft(); else { S.inspectorOpen = false; renderMain(); paintCursor(false); } return;
    case "wq": if (!S.draft) { S.cmdError = "no draft to write"; renderStatus(); return; } ok(); stageDraft({ close: true }); return;
    case "export": ok(); openModal("export"); return;
    case "changes": ok(); setView("changes"); return;
    case "skills": ok(); setView("skills"); return;
    case "packages": ok(); setView("packages"); return;
    case "budget": ok(); if (S.view !== "skills") S.view = "skills"; setLens(S.lens === "budget" ? "management" : "budget"); return;
    case "theme":
      if (!["light", "dark", "system"].includes(arg)) { S.cmdError = "theme takes light, dark, or system"; renderStatus(); return; }
      ok(); setTheme(arg); return;
    case "filter": if (arg !== "clear") { S.cmdError = "only :filter clear is supported"; renderStatus(); return; } ok(); clearFilters(); return;
    case "": ok(); return;
    default: S.cmdError = `not a console command: ${text}`; renderStatus();
  }
}

// ---- Keyboard --------------------------------------------------------------------------------
const isField = (el) => Boolean(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable));
function onKey(ev) {
  const t = isField(ev.target) ? ev.target : (isField(document.activeElement) ? document.activeElement : null);
  const inField = Boolean(t);
  if (S.modal) {
    if (ev.key === "Escape") { ev.preventDefault(); closeModal(); }
    else if (ev.key === "?" && S.modal === "help") { ev.preventDefault(); closeModal(); }
    else if (ev.key === "Enter" && S.modal === "export") { ev.preventDefault(); confirmExport(); }
    else if (ev.key === "Enter" && S.modal === "fraction") { ev.preventDefault(); stageFraction(); }
    return;
  }
  if (S.prompt) {
    if (ev.key === "Escape") { ev.preventDefault(); hidePrompt(); }
    else if (S.prompt.confirmKeys.includes(ev.key)) { ev.preventDefault(); confirmPrompt(); }
    else if (!inField) ev.preventDefault();
    return;
  }
  if (S.mode === "COMMAND") return;
  if (inField) {
    if (ev.key === "Escape" && !(S.draft && t === S.draft.textarea)) {
      ev.preventDefault();
      if (t === searchInput && S.search) { S.search = ""; searchInput.value = ""; onSearchChanged(); }
      t.blur();
      setMode("NORMAL");
    }
    return;
  }
  if (ev.metaKey || ev.altKey) return;
  if (ev.ctrlKey) {
    if (ev.key === "d") halfPage(1); else if (ev.key === "u") halfPage(-1); else if (ev.key === "r") doRedo(); else if (ev.key === "s" && S.draft) stageDraft({}); else return;
    ev.preventDefault();
    return;
  }
  const key = ev.key;
  if (/^[0-9]$/.test(key) && (S.count || key !== "0")) { S.count += key; S.pending = ""; renderStatus(); ev.preventDefault(); return; }
  const count = Math.max(1, parseInt(S.count || "1", 10));
  const pending = S.pending;
  S.pending = "";
  S.cmdError = "";
  if (pending === "g" && key === "g") { jumpCursor(false); S.count = ""; ev.preventDefault(); renderStatus(); return; }
  if (pending === "z") { if ("aocRM".includes(key)) zCommand(key); S.count = ""; ev.preventDefault(); renderStatus(); return; }
  switch (key) {
    case "j": case "ArrowDown": moveCursor(count); break;
    case "k": case "ArrowUp": moveCursor(-count); break;
    case "g": case "z": S.pending = key; renderStatus(); ev.preventDefault(); return;
    case "G": jumpCursor(true); break;
    case "}": for (let i = 0; i < count; i++) nextPackage(1); break;
    case "{": for (let i = 0; i < count; i++) nextPackage(-1); break;
    case "Enter": case "l": openCurrent(); break;
    case "h": if (S.inspectorOpen && S.view !== "changes") { S.inspectorOpen = false; renderMain(); paintCursor(false); } else collapseCurrent(); break;
    case "/": focusSearch(); break;
    case "n": nextMatch(1); break;
    case "N": nextMatch(-1); break;
    case "Escape": escapeNormal(); break;
    case "e": { const m = cursorSkill(); if (m) startDraft(m); else toast("select a skill first"); break; }
    case "m": toggleFlag(cursorSkill(), "disable-model-invocation"); break;
    case "v": toggleFlag(cursorSkill(), "user-invocable"); break;
    case "E": stagePackage(cursorPackage(), "set_package_enabled"); break;
    case "L": stagePackage(cursorPackage(), "set_default_loaded"); break;
    case "F": openModal("fraction"); break;
    case "x": deleteSkill(cursorSkill()); break;
    case "u": doUndo(); break;
    case "d": if (S.view === "changes") removeCurrentOp(); else toast("d removes a staged operation in the Changes view (c)"); break;
    case "c": setView("changes"); break;
    case "b": if (S.view !== "skills") S.view = "skills"; setLens(S.lens === "budget" ? "management" : "budget"); break;
    case "p": togglePin(); break;
    case "X": openModal("export"); break;
    case ":": openCommandLine(); break;
    case "?": openModal("help"); break;
    case "t": cycleTheme(); break;
    default: S.count = ""; renderStatus(); return;
  }
  S.count = "";
  ev.preventDefault();
  renderStatus();
}

// ---- Init ------------------------------------------------------------------------------------
function fatal(err) {
  const detail = `${err && err.stack ? err.stack : String(err)}\n\nconsole ${typeof SNAP !== "undefined" && SNAP ? `v${SNAP.console_version}, captured ${SNAP.captured_at}` : "(snapshot unreadable)"}`;
  const pre = h("pre", { text: detail });
  document.body.replaceChildren(h("div", { class: "fatal" }, h("h2", { text: "Could not open this skill snapshot" }),
    h("p", { text: (err && err.message) || String(err) }), h("p", { class: "t2" }, "Regenerate the page with ", h("code", { text: "skill-console render …" }), "."),
    h("details", { style: "margin-top:10px" }, h("summary", { text: "Technical detail" }), pre),
    h("div", { style: "margin-top:10px" }, h("button", { type: "button", text: "Copy error", onclick: () => navigator.clipboard && navigator.clipboard.writeText(detail) }))));
}
function init() {
  render();
  const first = NAV.find((n) => n.kind === "skill") || NAV[0];
  if (first) setCursor(first.id, { touched: false, scroll: false });
  document.addEventListener("keydown", onKey);
  document.addEventListener("focusin", (ev) => {
    const tr = ev.target.closest && ev.target.closest("tr.nav");
    if (tr && tr.dataset.id && tr.dataset.id !== S.cursorId) setCursor(tr.dataset.id, { scroll: false });
  });
  addEventListener("resize", () => { if (!$("budget-panel").hidden) drawStrips(); });
  const loading = $("loading");
  if (loading) loading.remove();
  APP_READY = true;
}
try { init(); } catch (err) { fatal(err); }
</script>
</body>
</html>
